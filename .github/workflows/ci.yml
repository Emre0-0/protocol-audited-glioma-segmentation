name: Release checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: requirements-analysis.txt
      - run: python scripts/verify_release.py
      - run: python -m pip install -r requirements-analysis.txt
      - run: python -m compileall -q scripts src research tests
      - run: python -m unittest discover -s tests -v
      - run: python scripts/render_report.py --output-dir outputs/review
